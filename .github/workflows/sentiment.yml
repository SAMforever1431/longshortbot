name: XAUUSD Sentiment Aggregator

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:


jobs:

  run-bot:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Restore previous sentiment state
      # ======================================================

      - name: Restore previous sentiment state
        uses: actions/cache@v4
        with:
          path: sentiment_state.json
          key: sentiment-state-${{ github.run_id }}
          restore-keys: |
            sentiment-state-


      # ======================================================
      # 3. Setup Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ======================================================
      # 4. Install dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. Verify CFTC package
      # ======================================================

      - name: Verify CFTC package
        run: |
          python -c "import cot_reports; print('✅ cot_reports installed successfully')"


      # ======================================================
      # 6. Run XAUUSD sentiment bot
      # ======================================================

      - name: Run XAUUSD sentiment bot
        env:

          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}

          OANDA_ENV: ${{ secrets.OANDA_ENV }}

          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}

          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python full_sentiment_bot.py
