name: XAUUSD Sentiment Aggregator

on:

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:


jobs:

  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Run XAUUSD sentiment bot

        env:

          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}

          OANDA_ENV: ${{ secrets.OANDA_ENV }}

          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}

          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python full_sentiment_bot.py
